
<!DOCTYPE html>
<html>
<head>
    <title>Logan County Pearson Correlation Table</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9f9fb;
            padding: 30px;
            color: #333;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .correlation-table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .correlation-table th, .correlation-table td {
            padding: 12px 16px;
            border: 1px solid #ddd;
        }
        .correlation-table th {
            background-color: #34495e;
            color: #fff;
            text-transform: capitalize;
        }
        .correlation-table tr:nth-child(even) {
            background-color: #ecf0f1;
        }
        .correlation-table tr:hover {
            background-color: #d0e6f7;
        }
    </style>
</head>
<body>
    <h2>Logan County Pearson Correlation Table</h2>
    <table border="1" class="dataframe correlation-table">
  <thead>
    <tr style="text-align: right;">
      <th>Variable 1</th>
      <th>Variable 2</th>
      <th>Pearson Coefficient</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Logan Population</td>
      <td>Irrigated Agriculture Acreage</td>
      <td>0.096</td>
    </tr>
    <tr>
      <td>Logan Population</td>
      <td>South Platte River Discharge</td>
      <td>-0.240</td>
    </tr>
    <tr>
      <td>Irrigated Agriculture Acreage</td>
      <td>South Platte River Discharge</td>
      <td>-0.181</td>
    </tr>
  </tbody>
</table>
</body>
</html>
